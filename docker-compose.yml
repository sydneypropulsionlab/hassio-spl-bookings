# Runs the add-on on a laptop (Docker Desktop) for testing, with its own MariaDB.
#   copy local-test\options.example.json to local-test\options.json and edit it, then:
#   docker compose up --build
#   open http://localhost:8090/Web/ and register with admin_email
# Delete the local-data folder to start again from an empty database.
name: spl-booking-test

services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: local-test-only
    volumes:
      - ./local-data/mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30

  booking:
    build: ./spl_librebooking
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      # Stands in for the Supervisor's MariaDB service login
      SPL_DB_HOST: mariadb
      SPL_DB_PORT: "3306"
      SPL_DB_ADMIN_USER: root
      SPL_DB_ADMIN_PASSWORD: local-test-only
      SPL_OPTIONS_FILE: /local-test/options.json
    volumes:
      - ./local-test:/local-test:ro
      - ./local-data/data:/data
      - ./local-data/config:/config
